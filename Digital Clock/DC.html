<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <!-- Importing a digital-style font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        /* --- CSS for Styling the Clock --- */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full viewport height */
            background-color: #282c34; /* Dark background */
            margin: 0;
            font-family: sans-serif;
        }

        #clock-container {
            font-family: 'Orbitron', sans-serif; /* A nice digital-style font */
            font-size: 5rem; /* Large font size */
            color: #61dafb; /* A bright, techy blue color */
            background-color: #1e2228; /* A slightly lighter dark background for the clock */
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6); /* A subtle glow effect */
            text-align: center;
            border: 2px solid #61dafb;
        }

        #date-display {
            font-size: 1.5rem; /* Smaller font for the date */
            color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- This is the main container for our clock and date -->
    <div id="clock-container">
        <div id="time-display"></div>
        <div id="date-display"></div>
    </div>

    <script>
        // --- JavaScript for Clock Functionality ---

        function updateClock() {
            // 1. Get the current date and time
            const now = new Date();

            // 2. Get hours, minutes, and seconds
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            // Determine AM or PM
            const ampm = hours >= 12 ? 'PM' : 'AM';

            // Convert to 12-hour format
            hours = hours % 12;
            hours = hours ? hours : 12; // The hour '0' should be '12'

            // 3. Add a leading zero if the number is less than 10
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            // 4. Format the time string
            const timeString = `${hours}:${minutes}:${seconds} ${ampm}`;

            // 5. Format the date string
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateString = now.toLocaleDateString('en-US', options);

            // 6. Update the HTML elements
            document.getElementById('time-display').textContent = timeString;
            document.getElementById('date-display').textContent = dateString;
        }

        // Run the function every second (1000 milliseconds)
        setInterval(updateClock, 1000);

        // Run the function once on page load to avoid a 1-second delay
        updateClock();
    </script>

</body>
</html>
