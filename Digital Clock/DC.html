<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <!-- Importing a digital-style font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        /* --- CSS for Styling the Clock --- */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full viewport height */
            background-color: #282c34; /* Dark background */
            margin: 0;
            font-family: sans-serif;
        }

        #clock-container {
            font-family: 'Orbitron', sans-serif; /* A nice digital-style font */
            font-size: 4rem; /* Adjusted font size */
            color: #61dafb; /* A bright, techy blue color */
            background-color: #1e2228; /* A slightly lighter dark background for the clock */
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6); /* A subtle glow effect */
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- This is the main container for our clock and date -->
    <div id="clock-container">
        <div id="datetime-display"></div>
    </div>

    <script>
        // --- JavaScript for Clock Functionality ---

        function updateClock() {
            const now = new Date();
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

            // Get all date and time components
            const year = now.getFullYear();
            const month = months[now.getMonth()];
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            // Format the date part: YYYY MON DD
            const dateString = `${year} ${month} ${day}`;

            // Format the time part: HH:MM:SS
            const timeString = `${hours}:${minutes}:${seconds}`;

            // Combine them and update the HTML element
            const fullDateTimeString = `${dateString}: ${timeString}`;
            document.getElementById('datetime-display').textContent = fullDateTimeString;
        }

        // Run the function every second (1000 milliseconds)
        setInterval(updateClock, 1000);

        // Run the function once on page load to avoid a 1-second delay
        updateClock();
    </script>

</body>
</html>
